[project]
name = "supportcopilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ujjwal Nimbokar", email = "ujjwalnimbokar2000@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.6",
    "langchain-core>=1.6.12",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.16",
    "langsmith>=0.14.11",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.0",
]

[project.scripts]
supportcopilot = "supportcopilot:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
